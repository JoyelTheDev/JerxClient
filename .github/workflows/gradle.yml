name: BleachHack  Builds

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Optional: Force-refresh dependencies (including Yarn mappings)
    - name: Refresh dependencies and generate sources
      run: ./gradlew --refresh-dependencies genSources

    - name: Build 
      run: ./gradlew build

    - name: Upload on artifiact
      uses: actions/upload-artifact@v4
      with:
        name: BleachHack
        path: |
          build/libs/bleachhack-*.jar
          !build/libs/bleachhack-*-*.jar
